StylesPath = .vale/styles
MinAlertLevel = suggestion

Vocab = Blog
Packages = Google

[docs/**/*.md]
BasedOnStyles = Vale

# Swap the built-in spelling check for one that ignores proper
# nouns/acronyms by shape, instead of hand-listing every name.
Vale.Spelling = NO
Blog.Spelling = YES

# Mechanical checks only -- no voice/style prescriptions.
# EmDash off: this blog consistently uses spaced em dashes on purpose.
Google.Quotes = YES
Google.Spacing = YES
Google.Parens = YES
Google.Ellipses = YES
Google.OxfordComma = YES
