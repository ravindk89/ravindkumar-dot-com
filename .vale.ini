StylesPath = .vale/styles
MinAlertLevel = suggestion

Vocab = Blog
Packages = Google

[docs/**/*.md]
BasedOnStyles = Vale

# Swap the built-in spelling check for one that ignores proper
# nouns/acronyms by shape, instead of hand-listing every name.
Vale.Spelling = NO
Blog.Spelling = YES

# Mechanical checks only -- no voice/style prescriptions.
# EmDash off: this blog consistently uses spaced em dashes on purpose.
# Parens off: noisy, and false-positives on Quarto fenced-div attributes.
# Ellipses off: leading ellipses are a deliberate rhetorical device here.
Google.Quotes = YES
Google.Spacing = YES
Google.Parens = NO
Google.Ellipses = NO
Google.OxfordComma = YES
