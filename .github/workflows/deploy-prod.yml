name: Deploy production

# Every merged PR is also a push to main, so push alone covers merges. (A
# separate pull_request:closed trigger used to deploy merged PRs a second time.)
on:
  push:
    branches: [main]

# Queue deploys instead of running two rsyncs against prod at once.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Build site
        run: make build-prod

      - name: Deploy
        uses: burnett01/rsync-deployments@v8
        with:
          switches: --mkpath -rv --delete
          path: ./dist/
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_port: ${{ secrets.DEPLOY_PORT }}
          remote_user: deploy-prod
          remote_key: ${{ secrets.DEPLOY_KEY }}
          remote_key_pass: ${{ secrets.DEPLOY_KEY_PASS }}
